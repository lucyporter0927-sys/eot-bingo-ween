<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#180726"><title>EOT Bingo'ween</title><style>
:root{--orange:#ff8a00;--ink:#fff8e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px;color:var(--ink);font-family:Arial,sans-serif;background:radial-gradient(circle at 15% 10%,#5b167f 0,transparent 28%),radial-gradient(circle at 85% 0,#a83e00 0,transparent 25%),linear-gradient(160deg,#0d0315,#210630 55%,#08020d)}.wrap{max-width:720px;margin:auto}header{text-align:center}h1{margin:3px 0;font-size:clamp(2rem,8vw,4rem);text-shadow:0 4px #4b0b69,0 0 20px #ff7900}.tag{color:#ffd7a1}.panel{background:#251038e8;border:2px solid #ff8a0088;border-radius:18px;padding:14px;box-shadow:0 16px 40px #0008}.setup{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}label{display:block;font-weight:800;margin-bottom:6px}input{width:100%;font:inherit;padding:12px;border:2px solid #7d48a6;border-radius:10px}button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px;cursor:pointer;background:linear-gradient(#ffad22,#f27700);color:#281000;box-shadow:0 4px #9a4100}.secondary{background:#4b2863;color:#fff;box-shadow:0 4px #291237}.player{text-align:center;font-weight:800;color:#ffd592;margin:8px}.status,.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}.badge{padding:7px 11px;border-radius:999px;background:#321245;border:1px solid #8c5bac}.badge.won{background:#075b3a;border-color:#54f1a5}.letters,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.letters div{text-align:center;font-size:clamp(1.5rem,7vw,2.7rem);font-weight:900;color:var(--orange)}.cell{aspect-ratio:1;min-width:0;padding:5px;border:2px solid #7a4b94;border-radius:9px;background:linear-gradient(145deg,#fffaf0,#eaccff);color:#1b0825;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(.65rem,3.2vw,1.1rem);line-height:1.05;overflow-wrap:anywhere;position:relative;user-select:none;touch-action:manipulation}.cell.marked{background:linear-gradient(145deg,#ff9d00,#ff5a00);color:#fff;border-color:#ffe08c;text-decoration:line-through;text-decoration-thickness:3px}.cell.marked:after{content:'✕';position:absolute;font-size:clamp(2.4rem,12vw,5rem);color:#36104da8}.help{text-align:center;color:#ddc9e8;font-size:.9rem}.toast{position:fixed;left:12px;right:12px;bottom:20px;max-width:520px;margin:auto;background:#111;border:2px solid #ff9b19;border-radius:14px;padding:14px;text-align:center;font-weight:800;opacity:0;transform:translateY(25px);pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:500px){.setup{grid-template-columns:1fr}.panel{padding:10px}.letters,.grid{gap:4px}.cell{border-width:1px}}
</style></head><body><div class="wrap"><header><div>🎃 🦇 👻 🕷️ 🎃</div><h1>EOT Bingo'ween</h1><p class="tag">Tap an answer to cross it off. Tap again to undo.</p></header><main class="panel"><section id="setup" class="setup"><div><label for="name">Enter your name</label><input id="name" maxlength="40" autocomplete="name" placeholder="e.g. Lucy"></div><button id="start">Create my card</button></section><section id="game" hidden><div id="player" class="player"></div><div class="status"><span id="one" class="badge">One line</span><span id="two" class="badge">Two lines</span><span id="full" class="badge">Full house</span></div><div class="letters"><div>B</div><div>I</div><div>N</div><div>G</div></div><div id="grid" class="grid"></div><div class="controls"><button id="clear" class="secondary">Clear marks</button><button id="new" class="secondary">New random card</button></div><p class="help">Each card contains 16 random answers from the 25-word pool. Rows, columns and diagonals count as lines. Your name and card remain private on this device.</p></section></main></div><div id="toast" class="toast" aria-live="polite"></div><script>
const WORDS=["FRANKENSTEIN","DRACULA","WITCH","PUMPKIN","MUMMY","BAT","ZOMBIE","VAMPIRE","GHOST","SKELETON","WEREWOLF","CAULDRON","BROOMSTICK","SPIDER","CANDY","BLACK CAT","HAUNTED HOUSE","SHADOW","COFFIN","MONSTER","MASK","GRAVEYARD","FULL MOON","JACK-O'-LANTERN","HOCUS POCUS"],$=s=>document.querySelector(s);let state={name:'',card:[],marked:[]};
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem('eot-bingoween-v2',JSON.stringify(state))}function load(){try{const s=JSON.parse(localStorage.getItem('eot-bingoween-v2'));if(s&&s.card?.length===16)state=s}catch(e){}}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2300)}function lines(){let a=[];for(let r=0;r<4;r++)a.push([0,1,2,3].map(c=>r*4+c));for(let c=0;c<4;c++)a.push([0,1,2,3].map(r=>r*4+c));a.push([0,5,10,15],[3,6,9,12]);return a.filter(x=>x.every(i=>state.marked.includes(i))).length}function status(old=-1){const n=lines(),full=state.marked.length===16;$('#one').classList.toggle('won',n>=1);$('#two').classList.toggle('won',n>=2);$('#full').classList.toggle('won',full);if(old>=0){if(full)toast("🎃 FULL HOUSE! Shout Bingo'ween!");else if(n>=2&&old<2)toast('🕸️ Two lines complete!');else if(n>=1&&old<1)toast('👻 One line complete!')}}function render(){$('#setup').hidden=true;$('#game').hidden=false;$('#player').textContent=state.name+"'s card";const g=$('#grid');g.innerHTML='';state.card.forEach((w,i)=>{const b=document.createElement('button');b.className='cell'+(state.marked.includes(i)?' marked':'');b.textContent=w;b.setAttribute('aria-pressed',state.marked.includes(i));b.onclick=()=>{const old=lines(),p=state.marked.indexOf(i);p>=0?state.marked.splice(p,1):state.marked.push(i);save();render();status(old)};g.appendChild(b)});status()}$('#start').onclick=()=>{const name=$('#name').value.trim();if(!name)return toast('Please enter your name first.');state={name,card:shuffle(WORDS).slice(0,16),marked:[]};save();render()};$('#name').onkeydown=e=>{if(e.key==='Enter')$('#start').click()};$('#clear').onclick=()=>{state.marked=[];save();render();toast('All marks cleared.')};$('#new').onclick=()=>{state.card=shuffle(WORDS).slice(0,16);state.marked=[];save();render();toast('New random card created.')};load();if(state.name&&state.card.length===16)render();
</script></body></html>
